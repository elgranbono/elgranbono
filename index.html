<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado del Sorteo</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f9f9fe;
      font-family: "Quicksand", "Nunito", "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      padding-top: 40px;
    }

    .resultado {
      background: linear-gradient(135deg, #1e3a6f 0%, #2d5298 100%);
      color: #fff;
      border-radius: 18px;
      padding: 34px 16px 45px;
      text-align: center;
      box-shadow: 0 18px 30px rgba(0, 0, 0, 0.27), 0 3px 8px rgba(0, 0, 0, 0.10);
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    h1, h2, .fecha {
      color: #334255;
      font-weight: 600;
      text-shadow: 0 3px 4px rgba(255,255,255,.7), 0 3px 6px rgba(255,255,255,.3);
    }

    h1 {
      font-size: clamp(34px, 8.6vw, 52px);
      letter-spacing: 0;
      line-height: 1.25;
      margin: 0 0 25.5px;
    }

    h2 {
      font-size: clamp(34px, 8.6vw, 52px);
      line-height: 1.48;
      margin: 0 0 1.5px;
    }

    .fecha {
      font-size: clamp(34px, 8.6vw, 52px);
      line-height: 1.48;
      margin: 0;
    }

    .registro {
      font-size: clamp(16px, 4.1vw, 23px);
      font-weight: 400;
      line-height: 1.25;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .numero {
      font-size: clamp(30px, 8.4vw, 60px);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.25;
      margin-top: 48px;
      text-shadow: 0 0 5px rgba(255,255,255,.7), 0 0 2px #fff;
    }
  </style>
</head>

<body>
  <div class="resultado">
    <h1>Resultado del Sorteo</h1>
    <h2 id="sorteo">----</h2>
    <div class="fecha" id="fecha">--/--/---/--</div>
    <div class="registro" id="registro"></div>
    <div class="numero" id="numero"></div>
  </div>

  <script>
    /*
     * Ejemplo de URL (la genera el QR del boleto):
     * ?id=OAX-153MIL-2026-10-29
     */

    // ✏️ CAMBIA AQUÍ EL NÚMERO GANADOR CUANDO QUIERAS
    const NUMERO_GANADOR = "94301";

    const DIAS = ["Dom", "Lun", "Mar", "Mie", "Jue", "Vie", "Sab"];
    const MESES = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN",
                   "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];

    function formatoFecha(iso) {
      const [a, m, d] = iso.split("-").map(Number);
      const f = new Date(a, m - 1, d);

      return DIAS[f.getDay()] + "/" + d + "/" +
             MESES[m - 1] + "/" + String(a).slice(2);
    }

    // Siempre en miles: "153MIL", "153" y "153000" salen como 153MIL
    function aMil(texto) {
      const n = parseFloat(texto);

      if (!n) return "----";

      const mil = (/MIL/i.test(texto) || n < 1000) ? n : n / 1000;

      return (Math.round(mil * 10) / 10) + "MIL";
    }

    function hoyISO() {
      const d = new Date();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");

      return d.getFullYear() + "-" + mm + "-" + dd;
    }

    const id = new URLSearchParams(window.location.search).get("id") || "";
    const partes = id.match(/^([A-Z]+)-(\d+(?:\.\d+)?(?:MIL)?)-(\d{4}-\d{2}-\d{2})$/);

    if (partes) {
      const fecha = partes[3];

      document.getElementById("sorteo").textContent = partes[1] + " " + aMil(partes[2]);
      document.getElementById("fecha").textContent = formatoFecha(fecha);

      if (fecha > hoyISO()) {
        document.getElementById("numero").textContent = "-----";
        document.getElementById("registro").textContent = "Resultado pendiente";
      } else {
        document.getElementById("numero").textContent = NUMERO_GANADOR;
        document.getElementById("registro").textContent = fecha + "T00:00:00";
      }
    } else {
      document.getElementById("numero").textContent = "-----";
      document.getElementById("registro").textContent = "Sin registro";
    }
  </script>
</body>
</html>
