<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado del Sorteo</title>

  <style>
    * { box-sizing: border-box; }

body {
  margin: 0;
  background: #f9f9fe;
  font-family: "Quicksand", "Nunito", "Segoe UI", Roboto, Arial, sans-serif;
  min-height: 100vh;
  padding-top: 40px;
}

.resultado {
 background: linear-gradient(135deg, #243a70 0%, #325395 100%);
  border-radius: 18px;
  color: #fff;
  border-radius: 28px;
  padding: 35px 16px 45px;
  text-align: center;
  box-shadow: 0 18px 30px rgba(30, 40, 80, 0.30);
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
}

h1, h2, .fecha {
  color: #364255;
  font-weight: 600;
  text-shadow: 0 3px 4px rgba(255,255,255,.7), 0 3px 6px rgba(255,255,255,.3);
}

h1 {
  font-size: clamp(34px, 8.6vw, 52px);
  letter-spacing: 0;
  line-height: 1.25;
  margin: 0 0 26px;
}

h2 {
  font-size: clamp(34px, 8.6vw, 52px);
  line-height: 1.48;
  margin: 0;
}

.fecha {
  font-size: clamp(34px, 8.6vw, 52px);
  line-height: 1.48;
  margin: 0;
}

.registro {
  font-size: clamp(16px, 4.1vw, 23px);
  font-weight: 400;
  line-height: 1.25;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

.numero {
  font-size: clamp(30px, 8.4vw, 60px);
  font-weight: 400;
  letter-spacing: 0;
  line-height: 1.25;
  margin-top: 47px;
  text-shadow: 0 0 5px rgba(255,255,255,.7), 0 0 2px #fff;
}
  </style>
</head>

<body>
  <div class="resultado">
    <h1>Resultado del Sorteo</h1>
    <h2 id="sorteo">----</h2>
    <div class="fecha" id="fecha">--/--/---/--</div>
    <div class="registro" id="registro"></div>
    <div class="numero" id="numero"></div>
  </div>

  <script>
    /*
     * Ejemplo de URL:
     * ?numero=94330&registro=2026-10-09T15:13:10.9066667&sorteo=OAX%2051MIL
     *
     * También se puede enviar:
     * ?numero=94330&registro=2026-10-09T15:13:10&bono=51
     *
     * La fecha se toma de "fecha" si se proporciona; si no,
     * se toman los primeros 10 caracteres de "registro".
     */

    const DIAS = ["Dom", "Lun", "Mar", "Mie", "Jue", "Vie", "Sab"];
    const MESES = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN",
                   "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];

    const p = new URLSearchParams(window.location.search);

    const numero = p.get("numero");
    const registro = p.get("registro");
    const sorteo = p.get("sorteo");
    const bono = p.get("bono");
    const estado = p.get("estado") || "OAX";
    let fechaISO = p.get("fecha");

    if (!fechaISO && registro) {
      fechaISO = registro.slice(0, 10);
    }

    function formatoFecha(iso) {
      if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
        return "--/--/---/--";
      }

      const [a, m, d] = iso.split("-").map(Number);
      const f = new Date(a, m - 1, d);

      return DIAS[f.getDay()] + "/" + d + "/" +
             MESES[m - 1] + "/" + String(a).slice(2);
    }

    const numeroValido = numero !== null && /^\d{5}$/.test(numero);

    document.getElementById("numero").textContent =
      numeroValido ? numero : "-----";

    document.getElementById("registro").textContent =
      registro || "Sin registro";

    document.getElementById("fecha").textContent =
      formatoFecha(fechaISO);

    function nombreSorteo() {
      if (sorteo) return sorteo;

      const n = Number(bono);

      if (bono && n > 0) {
        const miles = n >= 1000 ? n / 1000 : n;
        return estado + " " + miles + "MIL";
      }

      return "----";
    }

    document.getElementById("sorteo").textContent = nombreSorteo();
  </script>
</body>
</html>
